name: Auto-merge main promotion

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft, closed]

# pull_request_target can access the release PAT, so this workflow deliberately
# never checks out or executes code from the pull request.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Enable guarded auto-merge
    if: >-
      ${{
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.pull_request.head.ref == 'dev' ||
          startsWith(github.event.pull_request.head.ref, 'release-please--')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Clear any stale auto-merge request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          enabled=$(
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json autoMergeRequest --jq '.autoMergeRequest != null'
          )
          if [[ "$enabled" == "true" ]]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi

      - name: Require a releasing title for dev promotion
        if: ${{ github.event.pull_request.head.ref == 'dev' }}
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_pattern='^(feat|fix)(\([^)]+\))?!?:[[:space:]].+'
          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "::error::A dev → main squash title must start with feat: or fix: so Release Please creates a version."
            exit 1
          fi

      - name: Add feature commits to the Release Please changelog
        if: ${{ github.event.pull_request.head.ref == 'dev' }}
        shell: bash
        env:
          # Use GITHUB_TOKEN for this edit so the resulting `edited` event does
          # not recursively start another workflow run.
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # A persistent dev branch retains the original commits from earlier
          # squash releases, so main...dev grows forever. Find the most recent
          # release back-sync, then compare that graph point to this PR head.
          comparison=$(
            gh api \
              --paginate \
              --slurp \
              "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA?per_page=100"
          )
          last_sync_sha=$(
            jq -r '
              [
                .[].commits[]
                | select(
                    (.commit.message | split("\n")[0])
                    == "chore: sync released main back into dev"
                  )
              ]
              | sort_by(.commit.committer.date)
              | (last // {})
              | .sha // ""
            ' <<<"$comparison"
          )
          range_start="${last_sync_sha:-$BASE_SHA}"

          if [[ -n "$last_sync_sha" ]]; then
            echo "Collecting changelog commits after back-sync ${last_sync_sha:0:7}."
          else
            echo "No prior back-sync found; using the PR base for this initial promotion."
          fi

          # Release Please sees the dev → main squash commit, not the feature
          # commits behind it. Build its supported override from the bounded
          # graph comparison, not from the accumulated dev ancestry.
          override=$(
            gh api \
              --paginate \
              --slurp \
              "repos/$GITHUB_REPOSITORY/compare/$range_start...$HEAD_SHA?per_page=100" |
              jq -r '
                [
                  .[].commits[]
                  | select((.parents | length) == 1)
                  | .commit.message
                  | select(
                      test("^(feat|fix|deps)(\\([^)]+\\))?!?:[ ]+")
                      or test("^[a-z][a-z0-9-]*(\\([^)]+\\))?!:[ ]+")
                    )
                  | gsub("BEGIN_COMMIT_OVERRIDE|END_COMMIT_OVERRIDE"; "")
                ]
                | reduce .[] as $message (
                    [];
                    if index($message) then . else . + [$message] end
                  )
                | if length == 0 then
                    ""
                  else
                    "BEGIN_COMMIT_OVERRIDE\n"
                    + join("\n\n")
                    + "\nEND_COMMIT_OVERRIDE"
                  end
              '
          )

          if [[ -z "$override" ]]; then
            echo "::error::No releasable Conventional Commits were found after the latest release back-sync."
            exit 1
          fi

          current_body=$(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""'
          )
          updated_body=$(
            jq -nr \
              --arg body "$current_body" \
              --arg override "$override" '
                (
                  $body
                  | gsub(
                      "(?s)\\n*BEGIN_COMMIT_OVERRIDE\\n.*?\\nEND_COMMIT_OVERRIDE\\n*";
                      "\n\n"
                    )
                  | sub("[[:space:]]+$"; "")
                ) as $clean
                | if $clean == "" then
                    $override
                  else
                    $clean + "\n\n" + $override
                  end
              '
          )

          if (( ${#updated_body} > 65000 )); then
            echo "::error::Generated promotion PR body is too large for GitHub."
            exit 1
          fi

          if [[ "$updated_body" != "$current_body" ]]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              -f body="$updated_body" >/dev/null
            echo "Updated the Release Please commit override from ${range_start:0:7}...${HEAD_SHA:0:7}."
          else
            echo "Release Please commit override is already current."
          fi

      - name: Verify Release Please metadata scope
        if: ${{ startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_LABEL_PRESENT: "${{ contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}"
        run: |
          if [[ "$RELEASE_LABEL_PRESENT" != "true" ]]; then
            echo "::error::Release Please PR is missing the autorelease: pending label."
            exit 1
          fi
          title_pattern='^chore\(main\):[[:space:]]release[[:space:]][0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "::error::Unexpected Release Please PR title: $PR_TITLE"
            exit 1
          fi

          declare -A required=(
            [".release-please-manifest.json"]=0
            ["apps/desktop/CHANGELOG.md"]=0
            ["apps/desktop/package-lock.json"]=0
            ["apps/desktop/package.json"]=0
          )
          mapfile -t files < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename'
          )
          for file in "${files[@]}"; do
            if [[ ! -v "required[$file]" ]]; then
              echo "::error::Release Please PR changed an unexpected file: $file"
              exit 1
            fi
            required["$file"]=1
          done
          for file in "${!required[@]}"; do
            if [[ "${required[$file]}" != 1 ]]; then
              echo "::error::Release Please PR did not update required metadata: $file"
              exit 1
            fi
          done

      - name: Merge after protected-main requirements pass
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          gh pr merge "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --auto
          --squash
          --match-head-commit "$HEAD_SHA"
          --subject "$PR_TITLE"

  delete-release-please-branch:
    name: Delete merged release branch
    if: >-
      ${{
        github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release-please--')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the temporary Release Please branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: >-
          gh api
          --method DELETE
          "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"
